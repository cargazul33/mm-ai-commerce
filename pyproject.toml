[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-commerce"
version = "0.1.0"
description = "M&M AI Commerce — pipeline B2B Radar→Telegram (MVP gratis)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "SQLAlchemy>=2.0",
  "python-telegram-bot>=21.0",
  "python-dotenv>=1.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mm-commerce = "mm_commerce.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mm_commerce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
